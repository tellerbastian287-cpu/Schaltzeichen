<title>Schaltzeichen lernen</title>
<style>
:root{--bg:#eef1f4;--grid:#dbe1e8;--card:#fff;--ink:#14263d;--mute:#5b6b7d;--acc:#f2b705;--accink:#14263d;--ok:#1f7a4d;--no:#b3392f;--line:#c5ced8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--grid:#1a2531;--card:#17212d;--ink:#e8eef5;--mute:#92a1b2;--ok:#4cc38a;--no:#ff7a6e;--line:#2d3b4a}}
:root[data-theme="dark"]{--bg:#0f1720;--grid:#1a2531;--card:#17212d;--ink:#e8eef5;--mute:#92a1b2;--ok:#4cc38a;--no:#ff7a6e;--line:#2d3b4a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.stat{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scene{perspective:1200px;margin:8px 0 14px}
.card{position:relative;height:320px;width:100%;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .45s}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:2px solid var(--ink);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;box-shadow:6px 6px 0 var(--acc)}
.back{transform:rotateY(180deg)}
.face svg{width:100%;max-width:300px;height:auto;color:var(--ink)}
.face img{width:100%;max-width:300px;height:auto}
.back svg,.back img{max-width:150px;margin-bottom:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .face img{filter:invert(1)}}
:root[data-theme="dark"] .face img{filter:invert(1)}
.big{font-size:30px;font-weight:700;letter-spacing:-.01em}
.tag{font-size:13px;color:var(--mute);margin-top:10px}
.hint{position:absolute;bottom:10px;font-size:12px;color:var(--mute)}
.name{font-size:24px;font-weight:700;margin:2px 0}
.info{font-size:15px;color:var(--ink);margin:6px 0 0;max-width:36ch}
.kb{display:inline-block;margin-top:10px;border:1.5px solid var(--ink);border-radius:4px;padding:1px 8px;font-weight:700;font-size:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{padding:14px;border-radius:8px;border:2px solid var(--ink);background:var(--card);font-weight:700;font-size:16px}
.act.ok{border-color:var(--ok);color:var(--ok)}.act.no{border-color:var(--no);color:var(--no)}
.act:disabled{opacity:.4;cursor:default}
.tools{display:flex;justify-content:space-between;margin-top:14px;gap:8px}
.lnk{background:none;border:0;color:var(--mute);font-size:14px;text-decoration:underline;padding:6px 0}
.done{text-align:center;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:28px 18px;box-shadow:6px 6px 0 var(--acc)}
[hidden]{display:none!important}
.dtag{color:var(--mute);font-size:13px;margin-top:4px}
.dname{font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
canvas{display:block;width:100%;height:260px;touch-action:none;cursor:crosshair;background-color:var(--card);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:20px 20px;border:2px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--acc);margin:12px 0 16px}
.solp{margin-top:16px;text-align:center;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:14px;box-shadow:6px 6px 0 var(--acc)}
.solp img,.solp svg{max-width:220px;width:100%;height:auto;color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .solp img{filter:invert(1)}}
:root[data-theme="dark"] .solp img{filter:invert(1)}
.solp .row{margin-top:12px}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card,.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Schaltzeichen lernen</h1>
  <p class="sub">Karte antippen zum Umdrehen. Gewusst = Karte ist erledigt, Nochmal = kommt später wieder.</p>
  <div class="bar"><i id="bar"></i></div>
  <div class="stat"><span id="cnt"></span><span id="left"></span></div>
  <div class="chips" id="cats"></div>
  <div class="chips" id="modes">
    <button class="chip" data-m="0" aria-pressed="true">Symbol → Name</button>
    <button class="chip" data-m="1" aria-pressed="false">Name → Symbol</button>
    <button class="chip" data-m="2" aria-pressed="false">Zeichnen</button>
  </div>
  <div id="stage"></div>
  <div class="tools">
    <button class="lnk" id="shuf">Mischen</button>
    <button class="lnk" id="reset">Fortschritt zurücksetzen</button>
  </div>
</main>

const pic=c=>IMG[c.n]?`<img src="${IMG[c.n]}" alt="Schaltzeichen">`:svg(c.s);
CARDS.forEach((c,i)=>c.id=i);
const svg=(s,extra="")=>`<svg viewBox="0 0 100 60" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Schaltzeichen">${s}</svg>`;
const KEY="schaltzeichen-bekannt-v1";
let known=new Set(),cat="Alle",mode=0,queue=[],flip=false;
try{known=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...known]))}catch(e){}};
const cats=["Alle",...new Set(CARDS.map(c=>c.c))];
const $=id=>document.getElementById(id);
function build(){
  queue=CARDS.filter(c=>(cat==="Alle"||c.c===cat)&&!known.has(c.id)).map(c=>c.id);
  flip=false;render();
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderCats(){
  $("cats").innerHTML=cats.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cat}">${c}</button>`).join("");
}
function render(){
  renderCats();
  const pool=CARDS.filter(c=>cat==="Alle"||c.c===cat);
  const kn=pool.filter(c=>known.has(c.id)).length;
  $("bar").style.width=(pool.length?kn/pool.length*100:0)+"%";
  $("cnt").textContent=kn+" von "+pool.length+" gewusst";
  $("left").textContent=queue.length?queue.length+" offen":"";
  const st=$("stage");
  if(!queue.length){
    st.innerHTML=`<div class="done"><div class="big">Alles gewusst</div><p class="info" style="margin:8px auto">Alle Karten in „${cat}“ sind erledigt. Wiederhole sie oder wähle eine andere Gruppe.</p><button class="act" id="again" style="margin-top:12px">Alle Karten wiederholen</button></div>`;
    $("again").onclick=()=>{CARDS.filter(c=>cat==="Alle"||c.c===cat).forEach(c=>known.delete(c.id));save();queue=shuffle(CARDS.filter(c=>cat==="Alle"||c.c===cat).map(c=>c.id));render()};
    return;
  }
  const c=CARDS[queue[0]];
  if(mode===2){renderDraw(c);return}
  const front=mode===0?pic(c)+`<div class="tag">Wie heißt dieses Schaltzeichen?</div>`:`<div class="big">${c.n}</div><div class="tag">Wie sieht das Schaltzeichen aus?</div>`;
  st.innerHTML=`<div class="scene"><button class="card ${flip?"flip":""}" id="card" aria-label="Karte umdrehen">
    <div class="face front">${front}<span class="hint">Antippen zum Umdrehen</span></div>
    <div class="face back">${pic(c)}<div class="name">${c.n}</div><p class="info">${c.d}</p>${c.k?`<span class="kb" title="Kennbuchstabe">Kennbuchstabe ${c.k}</span>`:""}</div>
  </button></div>
  <div class="row"><button class="act no" id="no">Nochmal</button><button class="act ok" id="ok">Gewusst</button></div>`;
  $("card").onclick=()=>{flip=!flip;$("card").classList.toggle("flip",flip)};
  $("ok").onclick=()=>{known.add(queue.shift());save();flip=false;render()};
  $("no").onclick=()=>{const id=queue.shift();queue.push(id);flip=false;render()};
}
function renderDraw(c){
  $("stage").innerHTML=`<div class="dtag">Zeichne dieses Schaltzeichen:</div><div class="dname">${c.n}</div>
  <canvas id="cv" aria-label="Zeichenfläche"></canvas>
  <div class="row"><button class="act" id="clr">Löschen</button><button class="act" id="show">Lösung zeigen</button></div>
  <div class="solp" id="sol" hidden>${pic(c)}<p class="info" style="margin:8px auto 0">${c.d}</p><div class="row"><button class="act no" id="no">Nochmal</button><button class="act ok" id="ok">Gewusst</button></div></div>`;
  const cv=$("cv"),r=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*r;cv.height=h*r;
  const x=cv.getContext("2d");x.scale(r,r);x.lineWidth=3.5;x.lineCap="round";x.lineJoin="round";
  const ink=getComputedStyle(document.documentElement).getPropertyValue("--ink").trim()||"#000";
  x.strokeStyle=ink;x.fillStyle=ink;
  let d=false,px=0,py=0;
  const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
  cv.onpointerdown=e=>{e.preventDefault();d=true;try{cv.setPointerCapture(e.pointerId)}catch(_){}[px,py]=pos(e);x.beginPath();x.arc(px,py,1.8,0,7);x.fill()};
  cv.onpointermove=e=>{if(!d)return;const[a,b]=pos(e);x.beginPath();x.moveTo(px,py);x.lineTo(a,b);x.stroke();px=a;py=b};
  cv.onpointerup=cv.onpointercancel=()=>{d=false};
  $("clr").onclick=()=>x.clearRect(0,0,w,h);
  $("show").onclick=()=>{$("sol").hidden=false;$("show").disabled=true;$("sol").scrollIntoView({behavior:"smooth",block:"nearest"})};
  $("ok").onclick=()=>{known.add(queue.shift());save();render()};
  $("no").onclick=()=>{queue.push(queue.shift());render()};
}
$("cats").onclick=e=>{const b=e.target.closest("[data-c]");if(b){cat=b.dataset.c;build()}};
$("modes").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;mode=+b.dataset.m;[...$("modes").children].forEach(x=>x.setAttribute("aria-pressed",x===b));flip=false;render()};
$("shuf").onclick=()=>{shuffle(queue);flip=false;render()};
$("reset").onclick=()=>{known.clear();save();build()};
build();shuffle(queue);render();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
